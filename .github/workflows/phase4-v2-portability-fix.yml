name: Phase 4 V2 portability fix

on:
  push:
    branches:
      - agent/phase-4-baseline-v2
    paths:
      - .github/workflows/phase4-v2-portability-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-4-baseline-v2
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install inspection dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Apply and validate fix
        run: python tools/blender/apply_phase4_v2_portability_fix.py

      - name: Remove temporary migration files
        run: |
          rm tools/blender/apply_phase4_v2_portability_fix.py
          rm .github/workflows/phase4-v2-portability-fix.yml

      - name: Commit validated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "tools: make V2 baselines portable and previews edge-free"
          git push origin HEAD:agent/phase-4-baseline-v2
