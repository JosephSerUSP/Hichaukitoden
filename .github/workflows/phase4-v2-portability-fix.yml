name: Phase 4 V2 integration migration

on:
  push:
    branches:
      - agent/phase-4-baseline-v2-integration
    paths:
      - .github/workflows/phase4-v2-portability-fix.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone integration branch without marketplace actions
        env:
          REPOSITORY_TOKEN: ${{ github.token }}
        run: |
          git clone --branch agent/phase-4-baseline-v2-integration --single-branch \
            "https://x-access-token:${REPOSITORY_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" work

      - name: Merge current main
        run: |
          cd work
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main

      - name: Apply portability migration and validate
        run: |
          cd work
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --disable-pip-version-check pillow
          python tools/blender/apply_phase4_v2_portability_fix.py
          python -m unittest discover -s tools/asset-language/tests -p 'test_*.py' -v
          python -m unittest discover -s tools/asset-gen/tests -p 'test_*.py' -v
          python -m unittest discover -s tools/blender/tests -p 'test_*.py' -v

      - name: Publish integration result
        run: |
          cd work
          rm tools/blender/apply_phase4_v2_portability_fix.py
          rm .github/workflows/phase4-v2-portability-fix.yml
          rm -rf .venv
          git add -A
          git diff --cached --check
          git commit -m "integrate Phase 4 V2 baselines with current main"
          git push origin HEAD:agent/phase-4-baseline-v2-integration
