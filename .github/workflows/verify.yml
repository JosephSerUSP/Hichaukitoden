# Phase A of the repository CI baseline (issue #164).
#
# Scope is deliberately small: prove that a clean GitHub-hosted Windows runner
# can execute the project's own deterministic verification entry points. The
# golden gates (G2/G3/G4) are Phase B and are NOT run here; G5/G6 are explicitly
# out of scope for hosted CI because they depend on GPU/driver and browser
# rendering environments.
#
# This workflow reports on repository state. It never regenerates a golden
# reference, never rewrites docs/ENGINE-STATE.md, and asserts afterwards that
# no tracked file changed.
name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase-a:
    name: G1 + unit + save (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      # Pinned deliberately: a floating "latest" would let an upstream release
      # change what a green check means. 11.5 is the version that verifies this
      # project locally. (docs/reports/current-gate-baseline.md still says 11.4;
      # that report is stale -- see issue #155.)
      LOVE_VERSION: "11.5"
      LOVE_URL: "https://github.com/love2d/love/releases/download/11.5/love-11.5-win64.zip"
      LOVE_SHA256: "BA6E56BE2685E53C817749C4A5007F51137136FE5A3AB64920508BABC2E74369"

      # A hosted Windows runner has no GPU: it offers only "1.1.0 - GDI Generic"
      # while LOVE requires OpenGL 2.1+. Without a software driver LOVE does not
      # merely fail -- it raises a modal message box that blocks until the job
      # times out (observed on the first run of this workflow). Mesa's llvmpipe
      # supplies the missing driver on the CPU.
      MESA_VERSION: "26.1.6"
      MESA_URL: "https://github.com/pal1000/mesa-dist-win/releases/download/26.1.6/mesa3d-26.1.6-release-msvc.7z"
      MESA_SHA256: "86B506AD38B8DAE9D37BDADE656A9003518D717BF4FF5475FF3F746E4EE768EB"

      # The runner has no audio endpoint either (ALCwasapiPlayback_open failed).
      # LOVE survives that, but the dummy driver keeps it off the startup path.
      SDL_AUDIODRIVER: "dummy"

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install LOVE ${{ env.LOVE_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "love.zip"
          $dest = Join-Path $env:RUNNER_TEMP "love"

          Invoke-WebRequest -Uri $env:LOVE_URL -OutFile $zip -MaximumRetryCount 3 -RetryIntervalSec 5

          # A GitHub release asset is not immutable by contract, so the pin is a
          # digest, not just a version number.
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          Write-Host "love-$env:LOVE_VERSION-win64.zip SHA256: $sha"
          if ($sha -ne $env:LOVE_SHA256) {
            throw "LOVE archive digest mismatch`n  expected: $($env:LOVE_SHA256)`n  actual:   $sha"
          }

          Expand-Archive -Path $zip -DestinationPath $dest -Force

          # Discover rather than assume: the archive's top-level directory name
          # has changed between releases.
          $lovec = Get-ChildItem -Path $dest -Recurse -Filter "lovec.exe" |
                   Select-Object -First 1 -ExpandProperty FullName
          if (-not $lovec) { throw "lovec.exe not found under $dest" }

          # Cheap smoke test: fail at install time if the pin did not
          # materialize, rather than deep inside a verification step.
          $reported = & $lovec --version 2>&1 | Out-String
          Write-Host "reported: $($reported.Trim())"
          if ($reported -notmatch [regex]::Escape($env:LOVE_VERSION)) {
            throw "expected LOVE $env:LOVE_VERSION, got: $($reported.Trim())"
          }

          "LOVEC=$lovec" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LOVE_DIR=$(Split-Path -Parent $lovec)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Mesa software OpenGL ${{ env.MESA_VERSION }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "mesa.7z"
          $mesa = Join-Path $env:RUNNER_TEMP "mesa"

          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive -MaximumRetryCount 3 -RetryIntervalSec 5
          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash
          Write-Host "mesa3d-$env:MESA_VERSION-release-msvc.7z SHA256: $sha"
          if ($sha -ne $env:MESA_SHA256) {
            throw "Mesa archive digest mismatch`n  expected: $($env:MESA_SHA256)`n  actual:   $sha"
          }

          & 7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "failed to extract Mesa archive" }

          # Discovered, not assumed: the archive's internal layout is upstream's
          # to change. Windows resolves opengl32.dll next to the executable
          # before the system copy, so dropping the x64 build beside lovec.exe
          # is what swaps GDI Generic for llvmpipe.
          $dll = Get-ChildItem -Path $mesa -Recurse -Filter "opengl32.dll" |
                 Where-Object { $_.FullName -match "x64" } |
                 Select-Object -First 1
          if (-not $dll) { throw "opengl32.dll (x64) not found in Mesa archive" }

          Copy-Item -Path (Join-Path $dll.DirectoryName "*.dll") -Destination $env:LOVE_DIR -Force
          Write-Host "installed software OpenGL into $env:LOVE_DIR"

          # Prove the swap took effect before any gate depends on it. LOVE prints
          # its renderer when it can create a window; failing here keeps a driver
          # problem from surfacing as an unexplained hang inside a gate.
          $probe = Join-Path $env:RUNNER_TEMP "glprobe"
          New-Item -ItemType Directory -Path $probe -Force | Out-Null
          @'
          function love.load()
            local name, version, vendor, device = love.graphics.getRendererInfo()
            print(string.format("renderer: %s | %s | %s | %s", name, version, vendor, device))
            love.event.quit(0)
          end
          '@ | Set-Content -Path (Join-Path $probe "main.lua") -Encoding utf8

          $info = & $env:LOVEC $probe 2>&1 | Out-String
          Write-Host $info.Trim()
          if ($info -notmatch "renderer:") { throw "LOVE could not create an OpenGL context" }

      # The three verification commands below are the project's canonical entry
      # points, invoked unmodified. Gate semantics live in the repository, not
      # in this YAML, so local and CI verification stay aligned as they evolve.

      - name: G1 - data validation
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & $env:LOVEC . validate
          if ($LASTEXITCODE -ne 0) { throw "G1 failed (exit $LASTEXITCODE)" }

      - name: unit - behavior suites
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & $env:LOVEC . unittest
          if ($LASTEXITCODE -ne 0) { throw "unit gate failed (exit $LASTEXITCODE)" }

      - name: save - save/load round trip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          & $env:LOVEC . savetest
          if ($LASTEXITCODE -ne 0) { throw "save gate failed (exit $LASTEXITCODE)" }

      - name: Assert verification left tracked files unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Untracked diagnostic output is tolerated (issue #164); rewriting a
          # tracked reference is not. Shown for visibility either way.
          $untracked = git ls-files --others --exclude-standard
          if ($untracked) {
            Write-Host "untracked output produced by verification (tolerated):"
            $untracked | ForEach-Object { Write-Host "  $_" }
          }

          git diff --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw "verification modified tracked files" }

          git diff --cached --stat --exit-code
          if ($LASTEXITCODE -ne 0) { throw "verification staged changes to tracked files" }

          Write-Host "tracked tree clean"
