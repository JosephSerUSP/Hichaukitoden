name: Materialize first-stratum surface fixtures

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-first-stratum-surface-fixtures.yml'
      - '.github/asset-batch-bootstrap/first-stratum-source.tar.gz.b64.part*'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified source package
        shell: bash
        run: |
          cat .github/asset-batch-bootstrap/first-stratum-source.tar.gz.b64.part* \
            | base64 --decode \
            | tar -xzf -
      - name: Install authored-map dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow scipy
      - name: Validate source and materialize authored maps
        shell: bash
        run: |
          python -m py_compile \
            tools/asset-gen/build_surface_fixture_batch_20260806.py \
            tools/asset-gen/run_surface_fixture_batch_20260806.py
          python tools/asset-gen/build_surface_fixture_batch_20260806.py
          python tools/asset-gen/build_surface_fixture_batch_20260806.py --check
          python - <<'PY'
          import json
          from pathlib import Path
          jobs = json.loads(Path('tools/asset-gen/batches/first_stratum_surface_fixture_20260806.json').read_text())
          manifest = json.loads(Path('assets/geometry/3_authored_surface_maps/first_stratum_20260806/manifest.json').read_text())
          assert len(jobs['jobs']) == 15, len(jobs['jobs'])
          assert sum(int(job.get('variants', 0)) for job in jobs['jobs']) == 45
          assert len(manifest['maps']) == 15, len(manifest['maps'])
          print('validated 15 jobs, 45 candidates, and 15 authored maps')
          PY
      - name: Commit exact recovered package
        shell: bash
        run: |
          rm -rf .github/asset-batch-bootstrap
          rm -f .github/workflows/materialize-first-stratum-surface-fixtures.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            tools/asset-gen/build_surface_fixture_batch_20260806.py \
            tools/asset-gen/run_surface_fixture_batch_20260806.py \
            tools/asset-gen/batches/first_stratum_surface_fixture_20260806.json \
            tools/asset-gen/batches/first_stratum_surface_fixture_20260806.md \
            tools/asset-gen/prompts/texturepiece.tags.md \
            tools/asset-gen/prompts/wall.tags.md \
            assets/geometry/3_authored_surface_maps/first_stratum_20260806 \
            .github/asset-batch-bootstrap \
            .github/workflows/materialize-first-stratum-surface-fixtures.yml
          git diff --cached --stat
          git commit -m 'Repair and materialize first-stratum surface fixture batch'
          git push origin HEAD:main
